<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable — INVOOFFICE</title>
  <meta name="description" content="Cette page n'existe pas ou a été déplacée. Retournez à l'accueil INVOOFFICE pour créer vos factures, devis, bons de livraison et avoirs en PDF.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://www.invooffice.com/">
  <meta name="theme-color" content="#121a2e">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/landing.css">
  <script>
    (function(){var t=localStorage.getItem('fb_theme');if(!t){t=window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';}document.documentElement.dataset.theme=t;var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==='light'?'#ffffff':'#121a2e';})();
  </script>
  <style>
    .nf { min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 48px var(--space-8); }
    .nf-inner { max-width: 560px; text-align: center; }
    .nf-code { font-size: 96px; font-weight: 800; line-height: 1; margin: 0 0 var(--space-7); background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .nf h1 { font-size: 28px; font-weight: 700; margin: 0 0 var(--space-5); color: var(--text); }
    .nf p { color: var(--muted); font-size: var(--fs-base-2); line-height: 1.6; margin: 0 0 var(--space-9); }
    .nf-actions { display: flex; gap: var(--space-5); justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header class="lp-header">
    <div class="lp-header-inner">
      <div class="brand">
        <div class="logo" aria-hidden="true">IN</div>
        <div>
          <p class="brand-name">INVOOFFICE</p>
          <p>Facturation intelligente</p>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="nf">
      <div class="nf-inner">
        <div class="nf-code" aria-hidden="true">404</div>
        <h1>Cette page est introuvable</h1>
        <p>La page que vous cherchez n'existe pas ou a été déplacée. Vous pouvez revenir à l'accueil pour découvrir INVOOFFICE et créer vos documents en PDF.</p>
        <div class="nf-actions">
          <a class="btn btn-accent btn-lg" href="/">Retour à l'accueil</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="lp-footer">
    <div class="lp-header-inner" style="justify-content:center;text-align:center;gap:var(--space-5);flex-wrap:wrap;">
      <span style="color:var(--muted);font-size:var(--fs-md);">© 2026 INVOOFFICE — Facturation simple pour le Maroc</span>
    </div>
  </footer>
</body>
</html>
