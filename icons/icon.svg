<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Document validé" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- Fond bleu nuit en dégradé -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172049"/>
      <stop offset="1" stop-color="#27327d"/>
    </linearGradient>
    <!-- Feuille de papier -->
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eeece7"/>
    </linearGradient>
    <!-- Pastille verte -->
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fc3a2"/>
      <stop offset="1" stop-color="#14a98a"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#080d2e" flood-opacity="0.38"/>
    </filter>
    <filter id="shadow2" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#080d2e" flood-opacity="0.35"/>
    </filter>
    <clipPath id="clip"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- Fond -->
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- Grand disque lumineux discret -->
    <circle cx="256" cy="180" r="220" fill="#ffffff" fill-opacity="0.045"/>

    <!-- Document incliné -->
    <g transform="translate(257 252) rotate(-6.5)" filter="url(#shadow)">
      <rect x="-105.5" y="-120.5" width="211" height="241" rx="15" fill="url(#paper)"/>

      <!-- Lignes de texte foncées -->
      <g stroke-linecap="round" fill="none">
        <g stroke="#c4c9db" stroke-width="12">
          <line x1="-70" y1="-52" x2="46" y2="-52"/>
          <line x1="-70" y1="-25" x2="66" y2="-25"/>
          <line x1="-70" y1="2"   x2="15" y2="2"/>
        </g>
        <!-- Lignes de texte claires -->
        <g stroke="#dde1ee" stroke-width="10">
          <line x1="-70" y1="34" x2="66" y2="34"/>
          <line x1="-70" y1="57" x2="66" y2="57"/>
          <line x1="-70" y1="80" x2="14" y2="80"/>
        </g>
      </g>

      <!-- Coin plié orange -->
      <g>
        <polygon points="50.5,-120.5 105.5,-120.5 105.5,-65.5" fill="#f4ae42"/>
        <polygon points="50.5,-120.5 105.5,-65.5 50.5,-65.5" fill="#d98e25"/>
      </g>
    </g>

    <!-- Pastille de validation -->
    <g filter="url(#shadow2)">
      <circle cx="351" cy="359" r="59" fill="#151c4b"/>
      <circle cx="351" cy="359" r="51" fill="url(#teal)"/>
      <path d="M324 361 L343 379 L381 338" fill="none" stroke="#ffffff"
            stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
